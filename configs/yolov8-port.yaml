# AMFDet-Lite 港口场景适配配置(YOLOv8n + LAE + SPPFSENetV2 + EUCB + P2 头)
# 基于 ultralytics/cfg/models/v8/yolov8-full-improved.yaml 修改
# 新增:P2(/4)高分辨率检测头,适应港口密集小目标场景
#
# 索引规划(经验证自洽):
#   backbone 0-9(与父配置一致)
#   head 10-28(P2 分支在 16-18,P3/P4/P5 在 19-27,Detect 28)

nc: 1 # 单类:ship
scales:
  n: [0.33, 0.25, 1024]

# YOLOv8.0n backbone(与父配置 yolov8-full-improved.yaml 完全一致)
backbone:
  - [-1, 1, Conv, [64, 3, 2]]      # 0-P1/2
  - [-1, 1, LAE, []]                # 1-P2/4
  - [-1, 3, C2f, [128, True]]       # 2
  - [-1, 1, LAE, []]                # 3-P3/8
  - [-1, 6, C2f, [256, True]]       # 4
  - [-1, 1, LAE, []]                # 5-P4/16
  - [-1, 6, C2f, [512, True]]       # 6
  - [-1, 1, LAE, []]                # 7-P5/32
  - [-1, 3, C2f, [1024, True]]      # 8
  - [-1, 1, SPPFSENetV2, [1024, 5]] # 9

# Head:top-down 到 P2,然后 bottom-up 回 P5,P2 为新增分支
head:
  - [-1, 1, EUCB, []]                # 10  upsample 9 -> /16
  - [[-1, 6], 1, Concat, [1]]        # 11  cat backbone P4
  - [-1, 3, C2f, [512]]              # 12  P4 feature

  - [-1, 1, EUCB, []]                # 13  upsample -> /8
  - [[-1, 4], 1, Concat, [1]]        # 14  cat backbone P3
  - [-1, 3, C2f, [256]]              # 15  P3 feature

  - [-1, 1, EUCB, []]                # 16  upsample -> /4    (NEW P2 分支)
  - [[-1, 2], 1, Concat, [1]]        # 17  cat backbone P2   (NEW)
  - [-1, 3, C2f, [128]]              # 18  P2 feature /4     (NEW)

  - [-1, 1, LAE, []]                 # 19  down -> /8        (NEW)
  - [[-1, 15], 1, Concat, [1]]       # 20  cat head P3
  - [-1, 3, C2f, [256]]              # 21  P3 /8

  - [-1, 1, LAE, []]                 # 22  down -> /16       (NEW)
  - [[-1, 12], 1, Concat, [1]]       # 23  cat head P4
  - [-1, 3, C2f, [512]]              # 24  P4 /16

  - [-1, 1, LAE, []]                 # 25  down -> /32       (NEW)
  - [[-1, 9], 1, Concat, [1]]        # 26  cat SPPF P5
  - [-1, 3, C2f, [1024]]             # 27  P5 /32

  - [[18, 21, 24, 27], 1, Detect, [nc]]  # 28  (P2, P3, P4, P5)
